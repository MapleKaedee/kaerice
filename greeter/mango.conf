# The Mango of the login screen: greetd runs `mango -c /usr/share/kaerice-greeter/mango.conf` as the user "greeter".
# install-greeter.sh copies this folder there. Check it with: mango -c greeter/mango.conf -p

numlock_on=1

# a link to ../mango/conf/input.conf: tap to click on the touchpad
source=./input.conf

# a config value is at most 255 bytes, so the rest is in the script
exec_once=/usr/share/kaerice-greeter/start.sh
