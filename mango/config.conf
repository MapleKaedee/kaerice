# kaerice for Mango, linked to ~/.config/mango by install.sh. Check it with: mango -c ~/.config/mango/config.conf -p
# Mango itself imports the environment into systemd and starts mango-session.target, which starts kaericed.

env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# one jemalloc arena: the default (4 per core) keeps memory the shell has already freed
exec_once=env MALLOC_CONF=narenas:1 qs -c kaerice

numlock_on=1

source=./conf/colors.conf
source=./conf/layout.conf
source=./conf/input.conf
source=./conf/windowrules.conf
source=./conf/binds.conf
source=./conf/binds-user.conf

# scroller on every tag; switch_layout cycles through circle_layout
tag_rule=id:*,layout_name:scroller
circle_layout=scroller,tile

# osu! lazer: tearing only while it is fullscreen
allow_tearing=2
window_rule=force_tearing:1,app_id:^osu!$
blur_optimized=1
sync_obj_enable=1
