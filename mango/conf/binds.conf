# The keys of hypr/conf/binds.lua. binds-user.conf holds the keys binds-user.lua changes (Mango refuses a key bound twice).
# The comment right above a bind is its "Group: action" for the SUPER+/ cheat sheet. Never a comment after a bind on
# its line: Mango passes it to the command.
# Not here, no Mango action for them: SUPER+W (toggle group), SUPER+Home / SUPER+End (first / last column).

# === Application Launchers ===
# Apps: terminal
bind=SUPER,t,spawn,kitty
# Apps: terminal
bind=SUPER,Return,spawn,kitty

# === Audio Controls ===
# Audio: volume up
bindl=none,XF86AudioRaiseVolume,spawn,qs -c kaerice ipc call osd volumeUp
# Audio: volume down
bindl=none,XF86AudioLowerVolume,spawn,qs -c kaerice ipc call osd volumeDown
# Audio: mute
bindl=none,XF86AudioMute,spawn,qs -c kaerice ipc call osd toggleMute
# Audio: mute microphone
bindl=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# s: by keysym, the keycode is the one of XF86AudioPlay
# Media: play / pause
bindsl=none,XF86AudioPause,spawn,qs -c kaerice ipc call media playPause
# Media: play / pause
bindl=none,XF86AudioPlay,spawn,qs -c kaerice ipc call media playPause
# Media: previous
bindl=none,XF86AudioPrev,spawn,qs -c kaerice ipc call media previous
# Media: next
bindl=none,XF86AudioNext,spawn,qs -c kaerice ipc call media next
# Media: player volume up
bindl=CTRL,XF86AudioRaiseVolume,spawn,qs -c kaerice ipc call media volumeUp
# Media: player volume down
bindl=CTRL,XF86AudioLowerVolume,spawn,qs -c kaerice ipc call media volumeDown

# === Brightness Controls ===
# Display: brightness up
bindl=none,XF86MonBrightnessUp,spawn,qs -c kaerice ipc call osd brightnessUp
# Display: brightness down
bindl=none,XF86MonBrightnessDown,spawn,qs -c kaerice ipc call osd brightnessDown

# === Window Management ===
# Window: close
bind=SUPER,q,killclient
# Window: maximize
bind=SUPER,f,togglemaximizescreen
# Window: fullscreen
bind=SUPER+SHIFT,f,togglefullscreen
# Window: float / tile
bind=SUPER+SHIFT,t,togglefloating

# === Focus Navigation ===
# Focus: left
bind=SUPER,Left,focusdir,left
# Focus: down
bind=SUPER,Down,focusdir,down
# Focus: up
bind=SUPER,Up,focusdir,up
# Focus: right
bind=SUPER,Right,focusdir,right
# Focus: left
bind=SUPER,h,focusdir,left
# Focus: down
bind=SUPER,j,focusdir,down
# Focus: up
bind=SUPER,k,focusdir,up
# Focus: right
bind=SUPER,l,focusdir,right

# === Window Movement ===
# Window: move left
bind=SUPER+SHIFT,Left,move_client,left
# Window: move down
bind=SUPER+SHIFT,Down,move_client,down
# Window: move up
bind=SUPER+SHIFT,Up,move_client,up
# Window: move right
bind=SUPER+SHIFT,Right,move_client,right
# Window: move left
bind=SUPER+SHIFT,h,move_client,left
# Window: move down
bind=SUPER+SHIFT,j,move_client,down
# Window: move up
bind=SUPER+SHIFT,k,move_client,up
# Window: move right
bind=SUPER+SHIFT,l,move_client,right

# === Monitor Navigation ===
# Monitor: focus left
bind=SUPER+CTRL,Left,focusmon,left
# Monitor: focus right
bind=SUPER+CTRL,Right,focusmon,right
# Monitor: focus left
bind=SUPER+CTRL,h,focusmon,left
# Monitor: focus down
bind=SUPER+CTRL,j,focusmon,down
# Monitor: focus up
bind=SUPER+CTRL,k,focusmon,up
# Monitor: focus right
bind=SUPER+CTRL,l,focusmon,right

# === Move to Monitor ===
# Monitor: move window left
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
# Monitor: move window down
bind=SUPER+SHIFT+CTRL,Down,tagmon,down
# Monitor: move window up
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
# Monitor: move window right
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
# Monitor: move window left
bind=SUPER+SHIFT+CTRL,h,tagmon,left
# Monitor: move window down
bind=SUPER+SHIFT+CTRL,j,tagmon,down
# Monitor: move window up
bind=SUPER+SHIFT+CTRL,k,tagmon,up
# Monitor: move window right
bind=SUPER+SHIFT+CTRL,l,tagmon,right

# === Workspace Navigation ===
# Workspace: next
bind=SUPER,Page_Down,viewtoright_have_client,0
# Workspace: previous
bind=SUPER,Page_Up,viewtoleft_have_client,0
# Workspace: next
bind=SUPER,u,viewtoright_have_client,0
# Workspace: previous
bind=SUPER,i,viewtoleft_have_client,0
# Workspace: move window to next
bind=SUPER+CTRL,Down,tagtoright,0
# Workspace: move window to previous
bind=SUPER+CTRL,Up,tagtoleft,0
# Workspace: move window to next
bind=SUPER+CTRL,u,tagtoright,0
# Workspace: move window to previous
bind=SUPER+CTRL,i,tagtoleft,0

# === Scratchpad ===
# Scratchpad: show / hide
bind=SUPER,s,toggle_scratchpad
# Scratchpad: send window
bind=SUPER+SHIFT,s,minimized
# Scratchpad: bring window back
bind=SUPER+CTRL,s,restore_minimized

# === Move Workspaces ===
# Workspace: move window to next
bind=SUPER+SHIFT,Page_Down,tagtoright,0
# Workspace: move window to previous
bind=SUPER+SHIFT,Page_Up,tagtoleft,0
# Workspace: move window to next
bind=SUPER+SHIFT,u,tagtoright,0
# Workspace: move window to previous
bind=SUPER+SHIFT,i,tagtoleft,0

# === Mouse Wheel Navigation ===
# Workspace: next
axisbind=SUPER,DOWN,viewtoright_have_client
# Workspace: previous
axisbind=SUPER,UP,viewtoleft_have_client
# Workspace: move window to next
axisbind=SUPER+CTRL,DOWN,tagtoright
# Workspace: move window to previous
axisbind=SUPER+CTRL,UP,tagtoleft

# === Touchpad Gestures ===
# Workspace: next
gesturebind=none,left,3,viewtoright_have_client
# Workspace: previous
gesturebind=none,right,3,viewtoleft_have_client

# === Numbered Workspaces ===
# Workspace: go to 1
bind=SUPER,1,view,1
# Workspace: go to 2
bind=SUPER,2,view,2
# Workspace: go to 3
bind=SUPER,3,view,3
# Workspace: go to 4
bind=SUPER,4,view,4
# Workspace: go to 5
bind=SUPER,5,view,5
# Workspace: go to 6
bind=SUPER,6,view,6
# Workspace: go to 7
bind=SUPER,7,view,7
# Workspace: go to 8
bind=SUPER,8,view,8
# Workspace: go to 9
bind=SUPER,9,view,9

# === Move to Numbered Workspaces ===
# Workspace: move window to 1
bind=SUPER+SHIFT,1,tag,1
# Workspace: move window to 2
bind=SUPER+SHIFT,2,tag,2
# Workspace: move window to 3
bind=SUPER+SHIFT,3,tag,3
# Workspace: move window to 4
bind=SUPER+SHIFT,4,tag,4
# Workspace: move window to 5
bind=SUPER+SHIFT,5,tag,5
# Workspace: move window to 6
bind=SUPER+SHIFT,6,tag,6
# Workspace: move window to 7
bind=SUPER+SHIFT,7,tag,7
# Workspace: move window to 8
bind=SUPER+SHIFT,8,tag,8
# Workspace: move window to 9
bind=SUPER+SHIFT,9,tag,9

# === Sizing & Layout ===
# Window: maximize (keep)
bind=SUPER+CTRL,f,set_proportion,1.0

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
# Window: move with mouse
mousebind=SUPER,btn_left,moveresize,curmove
# Window: resize with mouse
mousebind=SUPER,btn_right,moveresize,curresize

# === Manual Sizing ===
# Window: narrower
bind=SUPER,minus,resizewin,-100,+0
# Window: wider
bind=SUPER,equal,resizewin,+100,+0
# Window: shorter
bind=SUPER+SHIFT,minus,resizewin,+0,-100
# Window: taller
bind=SUPER+SHIFT,equal,resizewin,+0,+100

# === Screenshots ===
# each capture opens in the kaerice editor; without the shell it goes straight to ~/Pictures/Screenshots + clipboard
# Screenshot: region
bind=none,Print,spawn,~/.config/quickshell/kaerice/scripts/screenshot.sh region
# Screenshot: screen
bind=CTRL,Print,spawn,~/.config/quickshell/kaerice/scripts/screenshot.sh screen
# Screenshot: window
bind=ALT,Print,spawn,~/.config/quickshell/kaerice/scripts/screenshot.sh window

# === System Controls ===
# Display: screen on / off
bind=SUPER+SHIFT,p,sleep_toggle_monitor
