# The keys of hypr/conf/binds-user.lua: the stock keys it rebinds and the kaerice shell (Quickshell IPC).
# Not here, no Mango action for it: SUPER+period (move window to next column).

# Layout: cycle column width
bind=SUPER,r,switch_proportion_preset
# Layout: consume / expel left
bind=SUPER,bracketleft,scroller_stack,left
# Layout: consume / expel right
bind=SUPER,bracketright,scroller_stack,right

# kaerice shell (Quickshell IPC)
# Shell: launcher
bind=SUPER,space,spawn,qs -c kaerice ipc call launcher toggle
# Shell: power menu
bind=SUPER,x,spawn,qs -c kaerice ipc call power toggle
# Shell: power menu
bind=SUPER+SHIFT,e,spawn,qs -c kaerice ipc call power toggle
# Shell: wallpaper picker
bind=SUPER,y,spawn,qs -c kaerice ipc call wallpaper pick
# Shell: notifications
bind=SUPER,n,spawn,qs -c kaerice ipc call notifications toggle
# Shell: clipboard history
bind=SUPER,v,spawn,qs -c kaerice ipc call clipboard toggle
# Shell: emoji picker
bind=SUPER,semicolon,spawn,qs -c kaerice ipc call emoji toggle
# Shell: temp note
bind=SUPER+SHIFT,n,spawn,qs -c kaerice ipc call note toggle
# Shell: dashboard
bind=SUPER,d,spawn,qs -c kaerice ipc call dashboard toggle
# Shell: control center
bind=SUPER,a,spawn,qs -c kaerice ipc call controlCenter toggle
# Shell: lock screen
bind=SUPER+ALT,l,spawn,qs -c kaerice ipc call lock lock
# Mango has no global shortcuts: every Tab press is a process. Releasing Alt switches: the switcher sees that itself,
# a release bind on Alt never fires after Tab (Mango runs only the release of the last pressed key).
# Shell: switch window
bind=ALT,Tab,spawn,qs -c kaerice ipc call switcher next
# Shell: switch window back
bind=ALT+SHIFT,Tab,spawn,qs -c kaerice ipc call switcher prev
# Shell: overview
bind=SUPER,Tab,spawn,qs -c kaerice ipc call switcher overview
# Shell: settings
bind=SUPER,comma,spawn,qs -c kaerice ipc call settings toggle
# Shell: keybind cheat sheet
bind=SUPER,slash,spawn,qs -c kaerice ipc call keybinds toggle
# Caps / Num Lock popup: on release (the state settles there), also while locked, never swallowing the key
# Display: Caps Lock popup
bindrlp=none,Caps_Lock,spawn,qs -c kaerice ipc call osd capsLock
# Display: Num Lock popup
bindrlp=none,Num_Lock,spawn,qs -c kaerice ipc call osd numLock
